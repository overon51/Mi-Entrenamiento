<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Entrenamiento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- El color de la barra superior del móvil (azul oscuro) -->
    <meta name="theme-color" content="#0F172A">
</head>
<body>
    <header>
        <h1>MI ENTRENAMIENTO</h1>
        <p>Tu progreso empieza aquí</p>
    </header>

    <main>
        <section class="menu">
            <button onclick="mostrar('inicio')">Inicio</button>
            <button onclick="mostrar('ejercicios')">Ejercicios</button>
            <button onclick="mostrar('rutinas')">Rutinas</button>
            <button onclick="mostrar('progreso')">Progreso</button>
            <button onclick="mostrar('cronometro')">Cronómetro</button>
            <button onclick="mostrar('correr')">Cardio 🏃</button>
            <button onclick="mostrar('calendario')">Calendario</button>
            <button onclick="mostrar('tiempo')">Tiempo 🌤️</button>
            <button onclick="mostrar('musica')">Música y Podcast 🎵</button>
            <button onclick="mostrar('video')">Vídeos 🎬</button>
            <button class="boton-ajustes" onclick="mostrar('ajustes')">⚙️ Ajustes</button>
        </section>

        <section id="contenido"></section>
    </main>

    <div id="aviso"></div>
    
    <div id="floating-player" style="display: none;">
        <div class="info">
            <h4 id="player-titulo">Canción</h4>
            <span id="player-estado">Reproduciendo...</span>
        </div>
        <div class="controles">
            <button onclick="prevSong()">⏮</button>
            <button onclick="togglePlay()" id="btn-play-pause">⏸</button>
            <button onclick="nextSong()">⏭</button>
            <button onclick="cerrarReproductor()" style="background:transparent; color:var(--text-muted); box-shadow:none; font-size:20px; padding:0 10px;">✕</button>
        </div>
    </div>
    <audio id="global-audio"></audio>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('SW OK'));
        }
    </script>
</body>
</html>
